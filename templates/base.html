<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Growstar{% endblock %}</title>
    <script data-growstar-feedback src="{{ url_for('static', filename='js/growstar-feedback.js') }}"></script>
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block page %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
