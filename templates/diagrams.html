<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Diagramm Verwaltung</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
    --bg:#0f172a;
    --card:#1e293b;
    --accent:#22c55e;
    --danger:#ef4444;
    --text:#e5e7eb;
    --muted:#94a3b8;
}

body{
    margin:0;
    padding:20px;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

h1{margin:0;font-size:1.6rem}
a.back{color:var(--muted);text-decoration:none}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
}

.card{
    background:var(--card);
    border-radius:16px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.card h2{
    margin:0 0 12px;
    font-size:1rem;
    color:var(--muted);
    text-transform:uppercase;
}

button{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    font-weight:600;
    cursor:pointer;
    font-size:1rem;
}

.btn-export{background:var(--accent);color:#022c22}
.btn-reset{background:var(--danger);color:white}

input[type="file"]{
    width:100%;
    margin-top:10px;
    color:var(--text);
}

.hint{
    font-size:.9rem;
    color:var(--muted);
    margin-top:8px;
}
</style>
</head>

<body>

<header>
    <h1>📊 Diagramme</h1>
    <a href="/system" class="back">← zurück</a>
</header>

<div class="grid">

    <!-- EXPORT -->
    <div class="card">
        <h2>Export</h2>
        <button class="btn-export" onclick="exportData()">
            📤 Diagrammdaten exportieren
        </button>
        <div class="hint">
            Lädt alle gespeicherten Messwerte als JSON.
        </div>
    </div>

    <!-- IMPORT -->
    <div class="card">
        <h2>Import</h2>
        <input type="file" id="fileInput" accept=".json">
        <button class="btn-export" style="margin-top:10px" onclick="importData()">
            📥 Diagrammdaten importieren
        </button>
        <div class="hint">
            Überschreibt bestehende Diagrammdaten.
        </div>
    </div>

    <!-- RESET -->
    <div class="card">
        <h2>Zurücksetzen</h2>
        <button class="btn-reset" onclick="resetData()">
            🧹 Diagramme zurücksetzen
        </button>
        <div class="hint">
            Löscht alle gespeicherten Messdaten.<br>
            Regelung & Livewerte bleiben aktiv.
        </div>
    </div>

</div>

<script>
async function exportData(){
    window.location.href="/api/diagrams/export";
}

async function importData(){
    const file=document.getElementById("fileInput").files[0];
    if(!file){alert("Bitte Datei auswählen");return;}

    const text=await file.text();

    const ok=confirm(
        "⚠️ Diagrammdaten werden überschrieben!\n\nFortfahren?"
    );
    if(!ok)return;

    const res=await fetch("/api/diagrams/import",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:text
    });

    const data=await res.json();
    alert(data.status==="ok"?"✅ Import erfolgreich":"❌ Fehler beim Import");
}

async function resetData(){
    const ok=confirm(
        "⚠️ Alle Diagrammdaten werden gelöscht!\n\nFortfahren?"
    );
    if(!ok)return;

    const res=await fetch("/api/reset_history",{method:"POST"});
    const data=await res.json();
    alert(data.status==="ok"?"✅ Diagramme zurückgesetzt":"❌ Fehler");
}
</script>

</body>
</html>
