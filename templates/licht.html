<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Licht</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;padding:20px;background:#0f172a;color:#e5e7eb;font-family:system-ui}
.card{background:#1e293b;border-radius:16px;padding:20px;max-width:500px;margin:auto}
h1{margin-bottom:20px}
.row{margin-bottom:12px}
select,input{width:100%;padding:8px;border-radius:8px;border:1px solid #334155;background:#020617;color:#e5e7eb}
button{margin-top:20px;padding:10px;width:100%;border:none;border-radius:10px;background:#22c55e;font-weight:600}
.back{display:inline-block;margin-bottom:15px;color:#94a3b8;text-decoration:none}
.info{margin-top:15px;color:#94a3b8;font-size:.9rem}
.section{margin-top:20px;padding-top:10px;border-top:1px solid #334155}
</style>
</head>
<body>

<a href="/" class="back">← zurück</a>

<div class="card">
<h1>💡 Licht</h1>

<div class="row">
<label>Modus</label>
<select id="mode">
<option value="OFF">Deaktiviert</option>
<option value="ON">Dauerbetrieb</option>
<option value="TIME">Zeitgesteuert</option>
<option value="ENV">Automatisch (Profil Tag/Nacht)</option>
</select>
</div>

<div id="time-section" class="section">
<h3>Zeitfenster</h3>
<div class="row">
<label>Start</label>
<input type="time" id="start">
</div>
<div class="row">
<label>Ende</label>
<input type="time" id="end">
</div>
</div>

<div class="info">
Im Automatik-Modus nutzt das Licht die Tag/Nacht-Zeiten des aktiven Profils.
</div>

<button onclick="save()">💾 Speichern</button>
</div>

<script>
function minutesFromTime(t){
    if(!t) return 0;
    const [h,m]=t.split(":");
    return parseInt(h)*60 + parseInt(m);
}
function timeFromMinutes(min){
    const h=Math.floor(min/60).toString().padStart(2,"0");
    const m=(min%60).toString().padStart(2,"0");
    return h+":"+m;
}

function updateUI(){
    const mode=document.getElementById("mode").value;
    document.getElementById("time-section").style.display =
        mode==="TIME" ? "block":"none";
}

async function load(){
    const cfg = await fetch("/api/config").then(r=>r.json());

    document.getElementById("mode").value =
        cfg.DEVICE_MODES?.light || "ENV";

    const p = cfg.DEVICE_PARAMS?.light || {};

    if(p.start_min !== undefined)
        document.getElementById("start").value = timeFromMinutes(p.start_min);

    if(p.end_min !== undefined)
        document.getElementById("end").value = timeFromMinutes(p.end_min);

    updateUI();
}

async function save(){
    const data={
        DEVICE_MODES:{
            light:document.getElementById("mode").value
        },
        DEVICE_PARAMS:{
            light:{
                start_min:minutesFromTime(document.getElementById("start").value),
                end_min:minutesFromTime(document.getElementById("end").value)
            }
        }
    };

    await fetch("/api/config",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(data)
    });

    alert("Gespeichert");
}

document.getElementById("mode").addEventListener("change",updateUI);

load();
</script>
</body>
</html>
