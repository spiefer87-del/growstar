<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Pflanzendaten</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
    --bg:#0f172a;
    --card:#1e293b;
    --text:#e5e7eb;
    --muted:#94a3b8;
    --accent:#22c55e;
    --line:#334155;
}

*{box-sizing:border-box}

body{
    margin:0;
    padding:20px;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

h1{margin:0;font-size:1.6rem}
a.back{
    color:var(--muted);
    text-decoration:none;
}

.grid{
    max-width:1200px;
    display:grid;
    grid-template-columns: 1fr;
    gap:16px;
}

@media (min-width: 900px){
    .grid{ grid-template-columns: 1fr 1fr; }
}

.card{
    background:var(--card);
    border-radius:16px;
    padding:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h3{
    margin:0 0 10px;
    font-size:.9rem;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.08em;
}

.row{
    display:grid;
    grid-template-columns: 1fr;
    gap:8px;
    margin:10px 0;
}

.row.cols2{
    grid-template-columns: 1fr 1fr;
    gap:12px;
}

label{
    font-size:.9rem;
    color:var(--muted);
}

input{
    width:100%;
    background:#020617;
    color:var(--text);
    border:1px solid rgba(255,255,255,.12);
    border-radius:10px;
    padding:10px 12px;
    font-size:1rem;
    outline:none;
}

.badge{
    display:inline-flex;
    gap:8px;
    align-items:center;
    margin-top:10px;
    padding:6px 10px;
    border-radius:999px;
    background:#0b1224;
    border:1px solid rgba(255,255,255,.08);
    font-size:.9rem;
    color:#dbeafe;
}

button{
    width:100%;
    margin-top:14px;
    padding:12px 14px;
    border:none;
    border-radius:14px;
    background:var(--accent);
    color:#052e16;
    font-weight:900;
    font-size:1rem;
    cursor:pointer;
}

button:active{transform:scale(.99)}

.msg{
    margin-top:12px;
    font-size:.95rem;
    color:var(--muted);
}
.msg.ok{color:#86efac}
.msg.err{color:#fca5a5}

.small{font-size:.85rem;color:var(--muted)}
</style>
</head>

<body>

<header>
    <h1>🌿 Pflanzendaten</h1>
    <a class="back" href="/">← zurück</a>
</header>

<div class="grid" id="grid"></div>

<div style="max-width:1200px;margin-top:16px">
    <button onclick="saveAll()">💾 Alle Pflanzen speichern</button>
    <div id="msg" class="msg"></div>
</div>

<script>
function $(id){ return document.getElementById(id); }

function showMsg(text, ok=true){
    const el = $("msg");
    el.textContent = text;
    el.className = "msg " + (ok ? "ok" : "err");
    setTimeout(()=>{ el.textContent=""; el.className="msg"; }, 3500);
}

function calcHarvestDate(flowerStart, flowerDays){
    if(!flowerStart || !flowerDays) return null;

    try{
        const d = new Date(flowerStart + "T00:00:00");
        d.setDate(d.getDate() + parseInt(flowerDays));
        return d.toISOString().slice(0,10);
    }catch(e){
        return null;
    }
}

function daysLeft(harvestDate){
    if(!harvestDate) return null;
    try{
        const now = new Date();
        const d = new Date(harvestDate + "T00:00:00");
        const diff = Math.ceil((d - now) / (1000*60*60*24));
        return diff;
    }catch(e){
        return null;
    }
}

function plantCard(p){
    const id = p.id;

    const harvest = calcHarvestDate(p.flower_start, p.flower_days);
    const left = daysLeft(harvest);

    const badgeText = harvest
        ? (left != null
            ? `🌾 Ernte: ${harvest} (${left} Tage)`
            : `🌾 Ernte: ${harvest}`)
        : "🌾 Ernte: --";

    const html = `
        <div class="card" id="plant-${id}">
            <h3>Pflanze ${id}</h3>

            <div class="row">
                <div>
                    <label>Sorte / Name</label>
                    <input id="name-${id}" value="${(p.name ?? "").replaceAll('"','&quot;')}" placeholder="z.B. Amnesia Haze">
                </div>
            </div>

            <div class="row cols2">
                <div>
                    <label>Sativa %</label>
                    <input id="sativa-${id}" type="number" min="0" max="100" value="${p.sativa ?? ""}" placeholder="z.B. 70">
                </div>
                <div>
                    <label>Indica %</label>
                    <input id="indica-${id}" type="number" min="0" max="100" value="${p.indica ?? ""}" placeholder="z.B. 30">
                </div>
            </div>

            <div class="row cols2">
                <div>
                    <label>Startdatum</label>
                    <input id="seed-${id}" type="date" value="${p.seed_date ?? ""}">
                </div>
                <div>
                    <label>Blüte gestartet</label>
                    <input id="flowerstart-${id}" type="date" value="${p.flower_start ?? ""}" oninput="updateBadges()">
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Blütedauer (Tage)</label>
                    <input id="flowerdays-${id}" type="number" min="1" max="200" value="${p.flower_days ?? ""}" placeholder="z.B. 63" oninput="updateBadges()">
                    <div class="small">Wird für den Ernte-Rechner benutzt.</div>
                </div>
            </div>

            <div class="badge" id="badge-${id}">${badgeText}</div>
        </div>
    `;
    return html;
}

function updateBadges(){
    for(let id=1; id<=6; id++){
        const start = $("flowerstart-"+id)?.value;
        const days = $("flowerdays-"+id)?.value;

        const harvest = calcHarvestDate(start, days);
        const left = daysLeft(harvest);

        const badge = $("badge-"+id);
        if(!badge) continue;

        if(!harvest){
            badge.textContent = "🌾 Ernte: --";
        }else{
            badge.textContent = left != null
                ? `🌾 Ernte: ${harvest} (${left} Tage)`
                : `🌾 Ernte: ${harvest}`;
        }
    }
}

async function loadPlants(){
    const arr = await fetch("/api/plants/data").then(r=>r.json());

    const grid = $("grid");
    grid.innerHTML = "";

    for(const p of arr){
        grid.innerHTML += plantCard(p);
    }

    updateBadges();
}

function collectPlant(id){
    return {
        id,
        name: $("name-"+id).value,
        sativa: $("sativa-"+id).value,
        indica: $("indica-"+id).value,
        seed_date: $("seed-"+id).value,
        flower_days: $("flowerdays-"+id).value,
        flower_start: $("flowerstart-"+id).value
    };
}

async function saveAll(){
    const plants = [];
    for(let id=1; id<=6; id++){
        plants.push(collectPlant(id));
    }

    try{
        const r = await fetch("/api/plants/data",{
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify({ plants })
        });

        if(!r.ok) throw new Error("HTTP "+r.status);

        showMsg("✅ Pflanzendaten gespeichert");
    }catch(e){
        console.error(e);
        showMsg("❌ Fehler beim Speichern", false);
    }
}

loadPlants();
</script>

</body>
</html>
