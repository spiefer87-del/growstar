<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
    <meta name="theme-color" content="#020617">
    <title>{{ camera.name }} LIVE – Growstar</title>
    <style>
        *,*::before,*::after{box-sizing:border-box}
        html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020617;color:#f8fafc;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;touch-action:none}
        .viewer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000;cursor:zoom-in}
        .viewer.zoomed{cursor:grab}.viewer.dragging{cursor:grabbing}
        .viewer img{display:block;width:100%;height:100%;object-fit:contain;transform-origin:center;will-change:transform;user-select:none;-webkit-user-drag:none}
        .topbar,.controls{position:fixed;z-index:5;display:flex;align-items:center;gap:8px;padding:8px;border:1px solid rgba(148,163,184,.24);border-radius:14px;background:rgba(2,6,23,.78);box-shadow:0 8px 30px rgba(0,0,0,.32);backdrop-filter:blur(10px)}
        .topbar{top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));justify-content:space-between;pointer-events:none}
        .identity{min-width:0;padding:0 5px}.identity strong,.identity span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.identity strong{font-size:.9rem}.identity span{margin-top:2px;color:#94a3b8;font-size:.7rem}
        .live{flex:0 0 auto;padding:5px 9px;border:1px solid rgba(74,222,128,.5);border-radius:999px;background:rgba(22,163,74,.22);color:#86efac;font-size:.68rem;font-weight:900;letter-spacing:.06em}
        .controls{left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100vw - 20px)}
        button,a{display:inline-flex;align-items:center;justify-content:center;min-width:42px;min-height:42px;padding:8px 11px;border:1px solid rgba(148,163,184,.28);border-radius:10px;background:rgba(30,41,59,.92);color:#f8fafc;font:inherit;font-size:.78rem;font-weight:800;text-decoration:none;cursor:pointer;touch-action:manipulation}
        button:hover,a:hover,button:focus-visible,a:focus-visible{border-color:#4ade80;background:#14532d}
        .zoom-label{min-width:54px;text-align:center;font-size:.75rem;font-weight:800}
        .error{position:fixed;z-index:6;inset:50% auto auto 50%;transform:translate(-50%,-50%);max-width:min(520px,calc(100vw - 30px));padding:14px 17px;border:1px solid rgba(248,113,113,.5);border-radius:12px;background:rgba(69,10,10,.9);color:#fecaca;text-align:center}
        @media(max-width:560px){.button-text{display:none}.controls{gap:5px;padding:6px}button,a{min-width:40px;min-height:40px;padding:7px 9px}.identity strong{font-size:.82rem}}
    </style>
</head>
<body>
<main id="viewer" class="viewer" aria-label="Livebild von {{ camera.name }}">
    <img id="camera-image" src="{{ url_for('growcam_live', camera_id=camera.camera_id, viewer=1) }}" alt="Livestream von {{ camera.name }}" draggable="false">
</main>
<header class="topbar">
    <div class="identity"><strong>📷 {{ camera.name }}</strong><span>{{ tent_name }} · {{ camera.live_width }} px · {{ camera.live_fps }} Bilder/s</span></div>
    <span class="live">● LIVE</span>
</header>
<nav class="controls" aria-label="Kamerasteuerung">
    <a href="{{ url_for('grow_control_tent', tent_id=camera.tent_id) }}" title="Zur Station">← <span class="button-text">Station</span></a>
    <button type="button" data-action="out" aria-label="Verkleinern">−</button>
    <span id="zoom-label" class="zoom-label">100 %</span>
    <button type="button" data-action="in" aria-label="Vergrößern">＋</button>
    <button type="button" data-action="reset" title="Bild einpassen">↺ <span class="button-text">Einpassen</span></button>
    <button type="button" data-action="fullscreen" title="Browser-Vollbild">⛶ <span class="button-text">Vollbild</span></button>
</nav>
<div id="camera-error" class="error" hidden>Der Livestream konnte nicht geladen werden. Bitte Kamera und Netzwerk prüfen.</div>
<script>
(() => {
    const viewer = document.getElementById("viewer");
    const image = document.getElementById("camera-image");
    const label = document.getElementById("zoom-label");
    const error = document.getElementById("camera-error");
    let scale = 1, x = 0, y = 0, dragging = false, lastX = 0, lastY = 0;

    function apply() {
        image.style.transform = `translate(${x}px,${y}px) scale(${scale})`;
        label.textContent = `${Math.round(scale * 100)} %`;
        viewer.classList.toggle("zoomed", scale > 1);
    }
    function reset() { scale = 1; x = 0; y = 0; apply(); }
    function change(delta) {
        scale = Math.max(1, Math.min(5, scale + delta));
        if (scale === 1) { x = 0; y = 0; }
        apply();
    }
    document.querySelector(".controls").addEventListener("click", async event => {
        const action = event.target.closest("[data-action]")?.dataset.action;
        if (action === "in") change(.25);
        if (action === "out") change(-.25);
        if (action === "reset") reset();
        if (action === "fullscreen") {
            if (document.fullscreenElement) await document.exitFullscreen();
            else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
        }
    });
    viewer.addEventListener("dblclick", () => scale > 1 ? reset() : change(1));
    viewer.addEventListener("wheel", event => { event.preventDefault(); change(event.deltaY < 0 ? .2 : -.2); }, {passive:false});
    viewer.addEventListener("pointerdown", event => {
        if (scale <= 1) return;
        dragging = true; lastX = event.clientX; lastY = event.clientY;
        viewer.classList.add("dragging"); viewer.setPointerCapture(event.pointerId);
    });
    viewer.addEventListener("pointermove", event => {
        if (!dragging) return;
        x += event.clientX - lastX; y += event.clientY - lastY;
        lastX = event.clientX; lastY = event.clientY; apply();
    });
    function stop() { dragging = false; viewer.classList.remove("dragging"); }
    viewer.addEventListener("pointerup", stop);
    viewer.addEventListener("pointercancel", stop);
    image.addEventListener("error", () => { error.hidden = false; });
    image.addEventListener("load", () => { error.hidden = true; });
    apply();
})();
</script>
</body>
</html>
