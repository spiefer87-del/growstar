<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Hardware</title>

<style>

*,
*::before,
*::after{
    box-sizing:border-box;
}

:root{

    --bg:#0f172a;
    --card:#1e293b;
    --accent:#22c55e;
    --text:#e5e7eb;
    --muted:#94a3b8;

    --online:#16a34a;
    --offline:#475569;

}

body{

    margin:0;
    padding:20px;

    background:var(--bg);

    color:var(--text);

    font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;

}

header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:25px;

}

header h1{

    margin:0;

}

.back{

    color:var(--muted);

    text-decoration:none;

}

h3{

    margin:32px 0 14px;

    color:var(--muted);

    text-transform:uppercase;

    letter-spacing:.08em;

    font-size:.9rem;

}

.grid{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));

    gap:18px;

}

.card{

    background:var(--card);

    border-radius:16px;

    padding:20px;

    box-shadow:0 10px 30px rgba(0,0,0,.30);

}

.card-link{

    color:inherit;

    text-decoration:none;

}

.card h2{

    margin:0;

    font-size:1rem;

}

.sub{

    margin-top:6px;

    color:var(--muted);

    font-size:.85rem;

}

.button{

    width:100%;

    margin-top:18px;

    padding:14px;

    border:none;

    border-radius:12px;

    background:var(--accent);

    color:white;

    cursor:pointer;

    font-size:15px;

}

.button:hover{

    opacity:.9;

}

.badge{

    display:inline-block;

    margin-top:12px;

    padding:6px 12px;

    border-radius:999px;

    font-size:.8rem;

    font-weight:bold;

}

.online{

    background:var(--online);

}

.offline{

    background:var(--offline);

}

.debug{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:16px;

}

.debug-value{

    font-size:1.8rem;

    font-weight:bold;

}

@media(max-width:600px){

    body{

        padding:12px;

    }

}

</style>

</head>

<body>

<header>

<h1>🛜 Hardware</h1>

<a class="back" href="/system">

← System

</a>

</header>



<h3>Gateways</h3>

<div class="grid" id="gateway-grid">

<div class="card">

<h2>➕ Gateway hinzufügen</h2>

<div class="sub">

Suche automatisch nach Shelly Gateways.

</div>

<button
id="scan-gateway"
class="button">

Gateway suchen

</button>

</div>

</div>



<h3>Bluetooth Geräte</h3>

<div
class="grid"
id="device-grid">

</div>



<h3>Aktoren</h3>

<div
class="grid"
id="actuator-grid">

</div>



<h3>Hardware Status</h3>

<div class="grid">

<div class="card">

<div class="debug">

<div>

<div
id="gateway-count"
class="debug-value">

0

</div>

<div class="sub">

Gateways

</div>

</div>

<div>

<div
id="device-count"
class="debug-value">

0

</div>

<div class="sub">

Bluetooth Geräte

</div>

</div>

<div>

<div
id="actuator-count"
class="debug-value">

0

</div>

<div class="sub">

Aktoren

</div>

</div>

<div>

<div class="debug-value">

Growstar

</div>

<div class="sub">

Hardware Manager

</div>

</div>

</div>

</div>

</div>



<script>
async function scanGateways(){

    const btn = document.getElementById("scan-gateway");

    btn.disabled = true;
    btn.innerText = "Suche...";

    try{

        const response = await fetch(
            "/api/hardware/scan",
            {
                method:"POST"
            }
        );

        const data = await response.json();

        alert(
            data.found + " Gateway(s) gefunden."
        );

        loadHardware();

    }

    catch(err){

        console.error(err);

        alert("Gateway Scan fehlgeschlagen.");

    }

    btn.disabled = false;
    btn.innerText = "Gateway suchen";

}



async function loadHardware(){

    try{

        const response = await fetch("/api/hardware");

        const data = await response.json();

        renderGateways(data.gateways);

        renderDevices(data.devices);

        renderActuators(data.actuators);

    }

    catch(err){

        console.error(err);

    }

}



function renderGateways(gateways){

    const grid =
        document.getElementById("gateway-grid");

    // erste Karte behalten
    const firstCard = grid.firstElementChild;

    grid.innerHTML = "";

    grid.appendChild(firstCard);

    gateways.forEach(gateway=>{

        const card = document.createElement("a");

        card.href = "/devices/" + gateway.id;

        card.className = "card-link";

        card.innerHTML = `

            <div class="card">

                <h2>${gateway.name}</h2>

                <div class="sub">

                    ${gateway.ip}

                </div>

                <div class="badge ${gateway.online ? "online":"offline"}">

                    ${gateway.online ? "Online":"Offline"}

                </div>

                <div class="sub">

                    Firmware ${gateway.firmware}

                </div>

                <div class="sub">

                    RSSI ${gateway.rssi ?? "--"} dBm

                </div>

                <div class="sub">

                    Uptime ${gateway.uptime ?? "--"}

                </div>

            </div>

        `;

        grid.appendChild(card);

    });

    document.getElementById("gateway-count")
        .textContent = gateways.length;

}



function renderDevices(devices){

    const grid =
        document.getElementById("device-grid");

    grid.innerHTML = "";

    if(devices.length===0){

        grid.innerHTML = `

            <div class="card">

                <h2>Noch keine Bluetooth Geräte</h2>

                <div class="sub">

                    Starte später einen BLE Scan.

                </div>

            </div>

        `;

    }

    devices.forEach(device=>{

        grid.innerHTML += `

            <div class="card">

                <h2>${device.name}</h2>

                <div class="sub">

                    ${device.model}

                </div>

                <div class="badge ${device.online ? "online":"offline"}">

                    ${device.online ? "Verbunden":"Offline"}

                </div>

            </div>

        `;

    });

    document.getElementById("device-count")
        .textContent = devices.length;

}



function renderActuators(actuators){

    const grid =
        document.getElementById("actuator-grid");

    grid.innerHTML = "";

    if(actuators.length===0){

        grid.innerHTML = `

            <div class="card">

                <h2>Keine Aktoren</h2>

                <div class="sub">

                    Zurzeit sind keine Aktoren vorhanden.

                </div>

            </div>

        `;

    }

    actuators.forEach(actuator=>{

        grid.innerHTML += `

            <div class="card">

                <h2>${actuator.name}</h2>

                <div class="sub">

                    ${actuator.model}

                </div>

            </div>

        `;

    });

    document.getElementById("actuator-count")
        .textContent = actuators.length;

}



document
.getElementById("scan-gateway")
.addEventListener(
    "click",
    scanGateways
);

loadHardware();

setInterval(loadHardware,5000);

</script>

</body>
</html>
