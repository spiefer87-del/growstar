<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Dashboard Design</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --accent: #22c55e;
  --text: #e5e7eb;
  --muted: #94a3b8;
}
body{
    margin:0;
    padding:20px;
    background:#0f172a;
    color:#e5e7eb;
    font-family:system-ui;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
a.back {
    color:var(--muted);
    text-decoration:none;
    font-size:0.9rem;
}
h1{margin-bottom:10px}
h3{margin-top:20px}
.grid {
    display:grid;
    gap:20px;
    max-width:600px;
    margin:auto;
}
.card {
  background: var(--card);
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,.3);
  text-align: center;
  transition: transform .15s ease, box-shadow .15s ease;
}
.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:8px 0;
}
select,input{
    background:#020617;
    color:#e5e7eb;
    border:1px solid #334155;
    border-radius:8px;
    padding:6px 8px;
}
button{
    margin-top:20px;
    padding:10px 16px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:#052e16;
    font-weight:600;
    cursor:pointer;
}
#msg{
    margin-top:10px;
    font-size:.9rem;
}
</style>
</head>

<body>
<header>
<h1>🎨 Dashboard Design</h1>
<a href="/" class="back">← Dashboard</a>
</header>
<div class="grid">

<div class="card">

<!-- ===================== -->
<!-- 🌱 UMGEBUNG -->
<!-- ===================== -->
<h3>Umgebungs-Kacheln</h3>

<div class="row"><label><input type="checkbox" id="env_profile"> Profil</label></div>
<div class="row"><label><input type="checkbox" id="env_temp"> Temperatur</label></div>
<div class="row"><label><input type="checkbox" id="env_hum"> Luftfeuchtigkeit</label></div>
<div class="row"><label><input type="checkbox" id="env_vpd"> VPD</label></div>
<div class="row"><label><input type="checkbox" id="env_ph"> pH-Wert</label></div>
<div class="row"><label><input type="checkbox" id="env_ec"> EC-Wert</label></div>
<div class="row"><label><input type="checkbox" id="env_water_temp"> Wassertemperatur</label></div>
<div class="row"><label><input type="checkbox" id="env_light_level"> Helligkeit</label></div>

<h3>Reihenfolge – Umgebung</h3>

<div class="row">Profil <select id="order_profile"></select></div>
<div class="row">Temperatur <select id="order_temp"></select></div>
<div class="row">Luftfeuchte <select id="order_hum"></select></div>
<div class="row">VPD <select id="order_vpd"></select></div>
<div class="row">pH <select id="order_ph"></select></div>
<div class="row">EC <select id="order_ec"></select></div>
<div class="row">Wasser <select id="order_water_temp"></select></div>
<div class="row">Licht <select id="order_light_level"></select></div>

<!-- ===================== -->
<!-- 🔌 GERÄTE -->
<!-- ===================== -->
<h3>Geräte-Kacheln</h3>

<div class="row"><label><input type="checkbox" id="dev_heating"> Heizung</label></div>
<div class="row"><label><input type="checkbox" id="dev_fan"> Lüfter</label></div>
<div class="row"><label><input type="checkbox" id="dev_light"> Licht</label></div>
<div class="row"><label><input type="checkbox" id="dev_vent"> Ventilator</label></div>
<div class="row"><label><input type="checkbox" id="dev_irrigation"> Bewässerung</label></div>
<div class="row"><label><input type="checkbox" id="dev_humidifier"> Luftbefeuchter</label></div>
<div class="row"><label><input type="checkbox" id="dev_dehumidifier"> Luftentfeuchter</label></div>
<div class="row"><label><input type="checkbox" id="dev_light2"> Licht 2</label></div>
<div class="row"><label><input type="checkbox" id="dev_vent2"> Ventilator 2</label></div>

<h3>Reihenfolge – Geräte</h3>

<div class="row">Heizung <select id="order_heating"></select></div>
<div class="row">Lüfter <select id="order_fan"></select></div>
<div class="row">Licht <select id="order_light"></select></div>
<div class="row">Ventilator <select id="order_vent"></select></div>
<div class="row">Bewässerung <select id="order_irrigation"></select></div>
<div class="row">Befeuchter <select id="order_humidifier"></select></div>
<div class="row">Entfeuchter <select id="order_dehumidifier"></select></div>
<div class="row">Licht 2 <select id="order_light2"></select></div>
<div class="row">Vent 2 <select id="order_vent2"></select></div>

<button onclick="save()">💾 Speichern</button>
<div id="msg"></div>

</div>
</div>
<script>
const ENV_KEYS = [
  "profile","temp","hum","vpd",
  "ph","ec","water_temp","light_level"
];

const DEV_KEYS = [
  "heating","fan","light","vent",
  "irrigation","humidifier","dehumidifier","light2","vent2"
];

function fillSelect(sel, count) {
    sel.innerHTML = "";
    for (let i = 1; i <= count; i++) {
        const o = document.createElement("option");
        o.value = i;
        o.textContent = i;
        sel.appendChild(o);
    }
}


async function load() {
    const cfg = await fetch("/api/config").then(r => r.json());

    const env = cfg.DASH_ENV || {};
    const envOrder = cfg.DASH_ENV_ORDER || {};
    const dev = cfg.DASH_DEVICE || {};
    const devOrder = cfg.DASH_DEVICE_ORDER || {};

    ENV_KEYS.forEach(k => {
        document.getElementById("env_" + k).checked = env[k] !== false;
        const sel = document.getElementById("order_" + k);
        fillSelect(sel, ENV_KEYS.length);
        sel.value = envOrder[k] ?? ENV_KEYS.length;
    });

    DEV_KEYS.forEach(k => {
        document.getElementById("dev_" + k).checked = dev[k] !== false;
        const sel = document.getElementById("order_" + k);
        fillSelect(sel, DEV_KEYS.length);
        sel.value = devOrder[k] ?? DEV_KEYS.length;
    });
}



async function save() {
    if (!confirm("Dashboard-Einstellungen überschreiben?")) return;

    const env = {};
    const envOrder = {};
    const dev = {};
    const devOrder = {};

    ENV_KEYS.forEach(k => {
        env[k] = document.getElementById("env_" + k).checked;
        envOrder[k] = Number(document.getElementById("order_" + k).value);
    });

    DEV_KEYS.forEach(k => {
        dev[k] = document.getElementById("dev_" + k).checked;
        devOrder[k] = Number(document.getElementById("order_" + k).value);
    });

    await fetch("/api/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            DASH_ENV: env,
            DASH_ENV_ORDER: envOrder,
            DASH_DEVICE: dev,
            DASH_DEVICE_ORDER: devOrder
        })
    });

    msg.textContent = "✅ Gespeichert – Dashboard wird neu geladen";
    setTimeout(() => location.href = "/", 800);
}


load();
</script>

</body>
</html>
