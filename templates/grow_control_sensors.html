{% extends "base.html" %}
{% block title %}Sensoren – Hardware & Setup{% endblock %}
{% block head %}
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#0f172a;--card:#1e293b;--card2:#111827;--text:#e5e7eb;--muted:#94a3b8;--border:rgba(148,163,184,.18)}
body{margin:0;padding:24px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
.wrap{max-width:1180px;margin:auto}.top{display:flex;gap:14px;align-items:center;margin-bottom:20px}.back{color:var(--muted);text-decoration:none;font-size:1.4rem}.subtitle{color:var(--muted);margin-top:5px;line-height:1.45}
.source-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.source-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}.source-head{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}.source-title{font-weight:800;font-size:1.05rem}.source-id{font-size:.75rem;color:var(--muted);word-break:break-all;margin-top:4px}.badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:.7rem;font-weight:800;white-space:nowrap;background:rgba(56,189,248,.15);color:#7dd3fc}.badge.online{background:rgba(34,197,94,.18);color:#86efac}.badge.offline{background:rgba(148,163,184,.14);color:#cbd5e1}.metrics{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.metric{background:var(--card2);padding:7px 9px;border-radius:9px;font-size:.78rem}.metric strong{font-size:.9rem}.empty{color:var(--muted);padding:16px;background:var(--card);border-radius:14px}
@media(max-width:650px){body{padding:12px}.source-grid{grid-template-columns:1fr}}
</style>
{% endblock %}
{% block page %}
<div class="wrap">
    <div class="top"><a class="back" href="{{ url_for('hardware_management_dashboard') }}">←</a><div><h1>🧪 Sensoren</h1><div class="subtitle">Verfügbare Sensorquellen und ihre aktuellen Messwerte</div></div></div>
    <div id="source-grid" class="source-grid"><div class="empty">Sensorquellen werden geladen …</div></div>
</div>
<script>
(() => {
    const grid=document.getElementById("source-grid");
    const esc=value=>String(value??"").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const fmt=(value,digits=1)=>value===null||value===undefined||value===""?"--":Number(value).toFixed(digits);
    async function load(){
        try{
            const response=await fetch("/api/sensors/sources",{cache:"no-store"});
            if(!response.ok)throw new Error("Sensorquellen konnten nicht geladen werden.");
            const data=await response.json(),sources=Array.isArray(data.sources)?data.sources:[];
            grid.innerHTML=sources.map(source=>{
                const online=source.online===true||(source.online==null&&Number(source.last_seen)>0&&Date.now()/1000-Number(source.last_seen)<90);
                return `<article class="source-card"><div class="source-head"><div><div class="source-title">${esc(source.label||source.id)}</div><div class="source-id">${esc(source.id)}</div></div><div class="badges"><span class="badge">${esc((source.type||"Sensor").toUpperCase())}</span><span class="badge ${online?'online':'offline'}">${online?'Online':'Offline'}</span></div></div><div class="metrics">
                    ${source.fields?.includes("temperature")?`<div class="metric">🌡️ <strong>${fmt(source.temperature)} °C</strong></div>`:""}
                    ${source.fields?.includes("humidity")?`<div class="metric">💧 <strong>${fmt(source.humidity)} %</strong></div>`:""}
                    ${source.fields?.includes("ppfd")?`<div class="metric">☀️ <strong>${fmt(source.ppfd,0)} µmol/m²/s</strong></div>`:""}
                    ${source.battery!=null?`<div class="metric">🔋 ${esc(source.battery)} %</div>`:""}
                    ${source.rssi!=null?`<div class="metric">📶 ${esc(source.rssi)} dBm</div>`:""}
                </div></article>`;
            }).join("")||'<div class="empty">Noch keine Sensorquellen verfügbar.</div>';
        }catch(error){grid.innerHTML=`<div class="empty">${esc(error.message)}</div>`}
    }
    load();setInterval(load,10000);
})();
</script>
{% endblock %}
