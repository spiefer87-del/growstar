<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Tagebuch</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
    --bg:#0f172a;
    --card:#1e293b;
    --text:#e5e7eb;
    --muted:#94a3b8;
    --accent:#22c55e;
    --danger:#ef4444;
    --line:#334155;
}

*{box-sizing:border-box}

body{
    margin:0;
    padding:20px;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
}

h1{
    margin:0;
    font-size:1.6rem;
}

a.back{
    color:var(--muted);
    text-decoration:none;
    font-size:1rem;
}

.grid{
    display:grid;
    grid-template-columns: 1fr;
    gap:20px;
    max-width:1200px;
}

@media (min-width: 900px){
    .grid{
        grid-template-columns: 440px 1fr;
        align-items:start;
    }
}

.card{
    background:var(--card);
    border-radius:16px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h3{
    margin:0 0 14px;
    font-size:.9rem;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.08em;
}

.row{
    display:grid;
    grid-template-columns: 1fr;
    gap:8px;
    margin:10px 0;
}

@media (min-width: 900px){
    .row.cols2{
        grid-template-columns: 1fr 1fr;
        gap:12px;
    }
    .row.cols3{
        grid-template-columns: 1fr 1fr 1fr;
        gap:12px;
    }
}

label{
    font-size:.9rem;
    color:var(--muted);
}

input, select, textarea{
    width:100%;
    background:#020617;
    color:var(--text);
    border:1px solid rgba(255,255,255,.12);
    border-radius:10px;
    padding:10px 12px;
    font-size:1rem;
    outline:none;
}

textarea{
    min-height:110px;
    resize:vertical;
}

button{
    width:100%;
    margin-top:12px;
    padding:12px 14px;
    border:none;
    border-radius:12px;
    background:var(--accent);
    color:#052e16;
    font-weight:800;
    font-size:1rem;
    cursor:pointer;
}

button:active{transform:scale(.99)}

.msg{
    margin-top:10px;
    font-size:.95rem;
    color:var(--muted);
}

.msg.ok{color:#86efac}
.msg.err{color:#fca5a5}

.list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.entry{
    background:#0b1224;
    border:1px solid rgba(255,255,255,.08);
    border-radius:14px;
    padding:14px;
}

.entry-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.entry-title{
    font-weight:800;
    font-size:1rem;
}

.entry-meta{
    margin-top:8px;
    font-size:.9rem;
    color:var(--muted);
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:4px 10px;
    border-radius:999px;
    font-size:.85rem;
    background:#111c33;
    border:1px solid rgba(255,255,255,.08);
}

.note{
    margin-top:10px;
    white-space:pre-wrap;
    line-height:1.35;
    color:#dbeafe;
}

.actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:12px;
}

.btn-del{
    background:transparent;
    border:1px solid rgba(239,68,68,.35);
    color:#fecaca;
    padding:8px 12px;
    border-radius:12px;
    cursor:pointer;
    font-weight:800;
}

.btn-del:hover{
    background:rgba(239,68,68,.12);
}

.small{
    font-size:.85rem;
    color:var(--muted);
}

hr.sep{
    border:none;
    border-top:1px solid rgba(255,255,255,.08);
    margin:18px 0;
}
</style>
</head>

<body>

<header>
    <h1>📓 Tagebuch</h1>
    <a class="back" href="/">← zurück</a>
</header>

<div class="grid">

    <!-- ===================== -->
    <!-- ✍️ NEUER EINTRAG -->
    <!-- ===================== -->
    <div class="card">
        <h3>Neuer Eintrag</h3>

        <div class="row cols2">
            <div>
                <label>Pflanze</label>
                <select id="plant"></select>
            </div>

            <div>
                <label>Aktion</label>
                <select id="action">
                    <option value="Gießen">🚿 Gießen</option>
                    <option value="Wasserwechsel">🪣 Wasserwechsel</option>
                    <option value="pH/EC Messung">🧪 pH/EC Messung</option>
                    <option value="Umtopfen">🪴 Umtopfen</option>
                    <option value="Düngen">🌿 Düngen</option>
                    <option value="Training / LST">🧵 Training / LST</option>
                    <option value="Notiz">📝 Notiz</option>
                </select>
            </div>
        </div>

        <div class="row cols3">
            <div>
                <label>pH (optional)</label>
                <input id="ph" type="number" step="0.01" placeholder="z.B. 6.20">
            </div>
            <div>
                <label>EC (optional)</label>
                <input id="ec" type="number" step="0.01" placeholder="z.B. 1.40">
            </div>
            <div>
                <label>Menge (optional)</label>
                <input id="amount" type="number" step="0.1" placeholder="z.B. 2.0 (L)">
                <div class="small">Einheit frei (L oder ml)</div>
            </div>
        </div>

        <div class="row">
            <div>
                <label>Freitext</label>
                <textarea id="note" placeholder="z.B. Blattspitzen leicht gelb, morgen weniger Dünger..."></textarea>
            </div>
        </div>

        <button onclick="saveEntry()">💾 Eintrag speichern</button>
        <div id="msg" class="msg"></div>

        <hr class="sep">

        <h3>Filter</h3>

        <div class="row cols3">
            <div>
                <label>Pflanze</label>
                <select id="filter-plant"></select>
            </div>
            <div>
                <label>Aktion</label>
                <select id="filter-action">
                    <option value="">Alle</option>
                    <option value="Gießen">Gießen</option>
                    <option value="Wasserwechsel">Wasserwechsel</option>
                    <option value="pH/EC Messung">pH/EC Messung</option>
                    <option value="Umtopfen">Umtopfen</option>
                    <option value="Düngen">Düngen</option>
                    <option value="Training / LST">Training / LST</option>
                    <option value="Notiz">Notiz</option>
                </select>
            </div>
            <div>
                <label>Suche</label>
                <input id="filter-search" placeholder="Text durchsuchen…">
            </div>
        </div>

        <button onclick="loadEntries()">🔎 Filtern</button>
        <div class="small">Tipp: Suche filtert Notizen + Aktion + Pflanzennamen.</div>
    </div>

    <!-- ===================== -->
    <!-- 📜 LISTE -->
    <!-- ===================== -->
    <div class="card">
        <h3>Einträge</h3>

        <div id="list" class="list">
            <div class="small">Lade Einträge…</div>
        </div>
    </div>

</div>

<script>
function $(id){ return document.getElementById(id); }

let PLANTS = {
    "1":"Pflanze 1",
    "2":"Pflanze 2",
    "3":"Pflanze 3",
    "4":"Pflanze 4",
    "5":"Pflanze 5",
    "6":"Pflanze 6"
};

function fmtDate(ts){
    try{
        const d = new Date(ts * 1000);
        return d.toLocaleString("de-DE", {
            year:"numeric",
            month:"2-digit",
            day:"2-digit",
            hour:"2-digit",
            minute:"2-digit"
        });
    }catch(e){
        return "";
    }
}

function showMsg(text, ok=true){
    const el = $("msg");
    el.textContent = text;
    el.className = "msg " + (ok ? "ok" : "err");
    setTimeout(()=>{ el.textContent=""; el.className="msg"; }, 3500);
}

function badge(text){
    return `<span class="badge">${text}</span>`;
}

function plantLabel(pid){
    if(!pid) return "Allgemein";
    return PLANTS[String(pid)] ?? ("Pflanze " + pid);
}

async function loadPlants(){
    try{
        const data = await fetch("/api/plants").then(r=>r.json());
        if(data && typeof data === "object"){
            PLANTS = data;
        }
    }catch(e){
        console.warn("plants load failed", e);
    }

    // Dropdowns füllen
    const plantSel = $("plant");
    const filterSel = $("filter-plant");

    plantSel.innerHTML = `<option value="">(optional)</option>`;
    filterSel.innerHTML = `<option value="">Alle</option>`;

    for(let i=1;i<=6;i++){
        const id = String(i);
        const name = PLANTS[id] ?? ("Pflanze " + id);

        plantSel.innerHTML += `<option value="${id}">${name}</option>`;
        filterSel.innerHTML += `<option value="${id}">${name}</option>`;
    }
}

async function saveEntry(){
    const payload = {
        plant: $("plant").value !== "" ? parseInt($("plant").value) : null,
        action: $("action").value,
        ph: $("ph").value,
        ec: $("ec").value,
        amount: $("amount").value,
        note: $("note").value
    };

    ["ph","ec","amount"].forEach(k=>{
        if(payload[k] === "") payload[k] = null;
    });

    if((payload.note ?? "").trim() === "" && payload.ph == null && payload.ec == null && payload.amount == null){
        showMsg("⚠️ Bitte mindestens eine Notiz oder einen Wert eintragen.", false);
        return;
    }

    try{
        const r = await fetch("/api/diary",{
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify(payload)
        });

        if(!r.ok) throw new Error("HTTP "+r.status);

        $("note").value = "";
        $("ph").value = "";
        $("ec").value = "";
        $("amount").value = "";

        showMsg("✅ Gespeichert");
        loadEntries();

    }catch(e){
        console.error(e);
        showMsg("❌ Fehler beim Speichern", false);
    }
}

async function deleteEntry(id){
    if(!confirm("Eintrag wirklich löschen?")) return;

    try{
        const r = await fetch("/api/diary/"+id,{ method:"DELETE" });
        if(!r.ok) throw new Error("HTTP "+r.status);
        loadEntries();
    }catch(e){
        console.error(e);
        alert("❌ Fehler beim Löschen");
    }
}

async function loadEntries(){
    const list = $("list");

    const filterPlant = $("filter-plant").value;
    const filterAction = $("filter-action").value;
    const filterSearch = ($("filter-search").value || "").trim().toLowerCase();

    try{
        const data = await fetch("/api/diary").then(r=>r.json());

        if(!Array.isArray(data) || data.length === 0){
            list.innerHTML = `<div class="small muted">Noch keine Einträge vorhanden.</div>`;
            return;
        }

        // -------------------------
        // Filter anwenden
        // -------------------------
        let rows = data;

        if(filterPlant !== ""){
            rows = rows.filter(e => String(e.plant ?? "") === String(filterPlant));
        }

        if(filterAction !== ""){
            rows = rows.filter(e => String(e.action ?? "") === String(filterAction));
        }

        if(filterSearch !== ""){
            rows = rows.filter(e=>{
                const p = plantLabel(e.plant).toLowerCase();
                const a = String(e.action ?? "").toLowerCase();
                const n = String(e.note ?? "").toLowerCase();
                return (p.includes(filterSearch) || a.includes(filterSearch) || n.includes(filterSearch));
            });
        }

        if(rows.length === 0){
            list.innerHTML = `<div class="small muted">Keine Einträge für diesen Filter.</div>`;
            return;
        }

        list.innerHTML = "";

        for(const e of rows){
            const plant = plantLabel(e.plant);
            const when = fmtDate(e.ts);

            const meta = [];
            meta.push(badge("📅 " + when));
            meta.push(badge("🌱 " + plant));
            if(e.action) meta.push(badge("🏷️ " + e.action));
            if(e.ph != null) meta.push(badge("🧪 pH " + Number(e.ph).toFixed(2)));
            if(e.ec != null) meta.push(badge("⚡ EC " + Number(e.ec).toFixed(2)));
            if(e.amount != null) meta.push(badge("💧 " + e.amount));

            const div = document.createElement("div");
            div.className = "entry";
            div.innerHTML = `
                <div class="entry-top">
                    <div>
                        <div class="entry-title">${e.action || "Eintrag"}</div>
                        <div class="entry-meta">${meta.join("")}</div>
                    </div>
                </div>

                ${e.note ? `<div class="note">${e.note}</div>` : ""}

                <div class="actions">
                    <button class="btn-del" onclick="deleteEntry(${e.id})">🗑️ Löschen</button>
                </div>
            `;

            list.appendChild(div);
        }

    }catch(err){
        console.error(err);
        list.innerHTML = `<div class="small" style="color:#fca5a5">❌ Fehler beim Laden</div>`;
    }
}

// live filter (ohne button)
["filter-plant","filter-action","filter-search"].forEach(id=>{
    document.addEventListener("input", (ev)=>{
        if(ev.target && ev.target.id === id){
            loadEntries();
        }
    });
});

(async ()=>{
    await loadPlants();
    await loadEntries();
    setInterval(loadEntries, 15000);
})();
</script>

</body>
</html>
